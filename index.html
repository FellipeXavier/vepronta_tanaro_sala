<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VePronta - Estabilizado</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background-color: #f0f0f0; }
        #ar-button {
            background-color: #007bff; color: white; border-radius: 30px; border: none;
            padding: 15px 35px; position: absolute; bottom: 10%; left: 50%;
            transform: translateX(-50%); font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="https://raw.githubusercontent.com/FellipeXavier/vepronta_tanaro_sala/main/tanaro.glb"
        ar 
        ar-modes="scene-viewer quick-look" 
        ar-scale="fixed" 
        ar-placement="floor"
        camera-controls 
        camera-target="0m 0m 0m"
        shadow-intensity="2" 
        exposure="1.2"
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">🏢 ABRIR CÂMERA (FOTO DISPONÍVEL)</button>
    </model-viewer>
</body>
</html>
