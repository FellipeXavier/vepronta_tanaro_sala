<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VePronta - Visão Ampliada</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background-color: #f0f0f0; }
        .instruction-card {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 20px;
            border-radius: 12px; font-size: 14px; text-align: center; z-index: 1000; display: none;
        }
        #ar-button {
            background-color: #28a745; color: white; border-radius: 30px; border: none;
            padding: 15px 35px; position: absolute; bottom: 10%; left: 50%;
            transform: translateX(-50%); font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="https://raw.githubusercontent.com/FellipeXavier/vepronta_tanaro_sala/main/tanaro.glb"
        ar ar-modes="scene-viewer quick-look webxr"
        ar-placement="floor"
        /* AJUSTE PARA SIMULAR 0.6x */
        field-of-view="90deg"
        min-field-of-view="10deg"
        max-field-of-view="120deg"
        camera-controls shadow-intensity="1.5" shadow-softness="0.5" exposure="1.2"
        environment-image="legacy" touch-action="pan-y">
        
        <div class="instruction-card" slot="ar-button-overlay">
            📍 MODO AMPLIO: Alinhe as folhas no chão.<br>
            🔄 Escala travada em 100%.
        </div>
        <button slot="ar-button" id="ar-button">🏢 ABRIR VISÃO AMPLIADA</button>
    </model-viewer>

    <script>
        const viewer = document.querySelector("model-viewer");
        const instruction = document.querySelector(".instruction-card");
        viewer.addEventListener("ar-status", (event) => {
            instruction.style.display = event.detail.status === "session-started" ? "block" : "none";
        });
    </script>
</body>
</html>
